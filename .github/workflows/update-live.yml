name: Atualizar jogos ao vivo

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar ao vivo
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          node scripts/update-live.mjs

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/live.json
          git add public/live-meta.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "chore: atualizar jogos ao vivo"
            git push
          fi
