name: Atualizar jogos do NEXOR

on:
  workflow_dispatch:

  schedule:
    - cron: "10 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar jogos
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          GAMES_TIMEZONE: America/Sao_Paulo
        run: |
          node scripts/update-games.mjs

      - name: Validar
        run: |
          node scripts/validate-games.mjs

      - name: Mostrar resumo
        run: |
          echo "Quantidade de jogos:"
          node -e "const g=require('./public/games.json'); console.log(g.length)"

          echo ""
          echo "Quantidade de logos:"
          find public/logos -type f -name "*.png" | wc -l

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/games.json
          git add public/data-meta.json
          git add public/logos/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "chore: atualizar jogos"
            git push
          fi
