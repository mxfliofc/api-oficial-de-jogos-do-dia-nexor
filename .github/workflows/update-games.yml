name: Atualizar agenda de jogos

on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-daily-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar agenda do dia
        env:
          GAMES_TIMEZONE: America/Sao_Paulo
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/update-games.mjs

      - run: node scripts/validate-games.mjs

      - name: Salvar JSON atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/games.json
          git diff --staged --quiet || git commit -m 'chore: atualizar jogos do dia'
          git push
