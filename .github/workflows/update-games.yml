name: Update daily games

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update games
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node scripts/update-games.mjs

      - name: Validate
        run: |
          node scripts/validate-games.mjs

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/games.json
          git add public/data-meta.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update daily games"
            git push
          fi
