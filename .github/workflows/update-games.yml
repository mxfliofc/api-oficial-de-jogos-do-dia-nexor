name: Atualizar agenda de jogos

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update games
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GAMES_TIMEZONE: "America/Sao_Paulo"
        run: node scripts/update-games.mjs

      - name: Validate JSON
        run: node scripts/validate-games.mjs

      - name: Show result
        run: |
          echo "Games:"
          cat public/games.json

          echo ""
          echo "Number of logos:"
          find public/logos -type f -name "*.png" | wc -l

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/games.json
          git add public/logos/

          if git diff --cached --quiet; then
            echo "No changes found."
          else
            git commit -m "chore: update games and logos"
            git push
          fi
