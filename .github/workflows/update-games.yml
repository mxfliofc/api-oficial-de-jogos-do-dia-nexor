```yaml
name: Atualizar agenda de jogos

on:
  workflow_dispatch:

  schedule:
    - cron: '10 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar jogos
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GAMES_TIMEZONE: America/Sao_Paulo
        run: node scripts/update-games.mjs

      - name: Validar JSON
        run: node scripts/validate-games.mjs

      - name: Mostrar resultado
        run: |
          echo "Games:"
          cat public/games.json

          echo ""
          echo "Quantidade de logos:"
          find public/logos -type f -name "*.png" | wc -l

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/games.json public/logos/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
          else
            git commit -m "chore: atualizar jogos e logos"
            git push
          fi
```
